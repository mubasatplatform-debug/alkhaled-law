name: CI

on:
  push:
    branches:
      - main
      - staging
      - "foundation/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The production build currently also runs database migrations.
      # Keep CI side-effect free until the Neon migration contract is verified.
      - name: Build application
        run: npm run build:dev
